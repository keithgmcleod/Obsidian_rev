name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6
      - name: Reassemble model
        run: |
          cat obsidian-2k.glb.part.00 obsidian-2k.glb.part.01 obsidian-2k.glb.part.02 > obsidian-2k.glb
          rm obsidian-2k.glb.part.00 obsidian-2k.glb.part.01 obsidian-2k.glb.part.02
      - name: Reassemble BILT Blue model
        run: |
          cat blue-model-parts/part.* > bilt-blue-2k.glb
          rm -rf blue-model-parts
      - name: Reassemble BILT Palladium model
        run: |
          cat palladium-model-parts/part.* > palladium-2k.glb
          rm -rf palladium-model-parts
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fix Palladium baked material alpha
        run: python scripts/fix_palladium_alpha.py palladium-2k.glb
      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Reduce Palladium front relief to 10 percent
        run: python scripts/reduce_palladium_front_normal.py palladium-2k.glb
      - name: Raise BILT Blue roughness by 35 percent
        run: python scripts/raise_blue_roughness.py bilt-blue-2k.glb
      - name: Raise BILT Obsidian roughness by 50 percent
        run: python scripts/raise_obsidian_roughness.py obsidian-2k.glb
      - name: Match BILT Blue hologram to Obsidian
        run: python scripts/match_blue_hologram.py bilt-blue-2k.glb obsidian-2k.glb
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
