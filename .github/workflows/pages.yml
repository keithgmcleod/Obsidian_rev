name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6
      - name: Reassemble model
        run: |
          cat obsidian-2k.glb.part.00 obsidian-2k.glb.part.01 obsidian-2k.glb.part.02 > obsidian-2k.glb
          rm obsidian-2k.glb.part.00 obsidian-2k.glb.part.01 obsidian-2k.glb.part.02
      - name: Reassemble BILT Blue model
        run: |
          cat blue-model-parts/part.* > bilt-blue-2k.glb
          rm -rf blue-model-parts
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
